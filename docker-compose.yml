services:
  postgres:
    image: postgres:16
    container_name: dental_clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wajih}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wajih}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
