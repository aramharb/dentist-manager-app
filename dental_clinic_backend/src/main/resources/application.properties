spring.application.name=demo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wajih}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5
spring.flyway.baseline-description=Existing dev database already matches V5

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.port=8080

# Override this value through JWT_SECRET outside local development.
app.auth.jwt-secret=${JWT_SECRET:change-this-development-jwt-secret-before-production-2026}
app.auth.jwt-lifetime-seconds=${JWT_LIFETIME_SECONDS:28800}

# Cabinet logo / cover uploads (2 MB per image is enforced by the service).
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
