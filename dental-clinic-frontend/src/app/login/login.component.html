<div class="stage">
  <div class="login-language"><app-language-switcher /></div>
  <div class="floaters" aria-hidden="true">
    <svg class="f1" viewBox="0 0 24 24" fill="none" stroke="#2c6fbb" stroke-width="1.4"><path d="M12 3c-3 0-5 2.2-5 5.4 0 3.6 1.4 6.1 1.9 8.8.3 1.6 2 1.7 2.4.2.4-1.5.6-2.9 1.7-2.9s1.3 1.4 1.7 2.9c.4 1.5 2.1 1.4 2.4-.2.5-2.7 1.9-5.2 1.9-8.8C17 5.2 15 3 12 3z"/></svg>
    <svg class="f2" viewBox="0 0 24 24" fill="none" stroke="#7fd3e8" stroke-width="1.6"><path d="M12 2v20M2 12h20" stroke-linecap="round"/></svg>
    <svg class="f3" viewBox="0 0 24 24" fill="#7fd3e8"><circle cx="12" cy="12" r="10" opacity=".5"/></svg>
    <svg class="f4" viewBox="0 0 24 24" fill="none" stroke="#2c6fbb" stroke-width="1.4"><path d="M12 3c-3 0-5 2.2-5 5.4 0 3.6 1.4 6.1 1.9 8.8.3 1.6 2 1.7 2.4.2.4-1.5.6-2.9 1.7-2.9s1.3 1.4 1.7 2.9c.4 1.5 2.1 1.4 2.4-.2.5-2.7 1.9-5.2 1.9-8.8C17 5.2 15 3 12 3z"/></svg>
    <svg class="f5" viewBox="0 0 24 24" fill="none" stroke="#66798d" stroke-width="1.4"><path d="M12 2v20M2 12h20" stroke-linecap="round"/></svg>
    <svg class="f6" viewBox="0 0 24 24" fill="#2c6fbb" opacity=".5"><circle cx="12" cy="12" r="9"/></svg>
    <svg class="f7" viewBox="0 0 24 24" fill="#7fd3e8"><circle cx="12" cy="12" r="10"/></svg>
    <svg class="f8" viewBox="0 0 24 24" fill="none" stroke="#7fd3e8" stroke-width="1.4"><path d="M12 3c-3 0-5 2.2-5 5.4 0 3.6 1.4 6.1 1.9 8.8.3 1.6 2 1.7 2.4.2.4-1.5.6-2.9 1.7-2.9s1.3 1.4 1.7 2.9c.4 1.5 2.1 1.4 2.4-.2.5-2.7 1.9-5.2 1.9-8.8C17 5.2 15 3 12 3z"/></svg>
  </div>

  <section class="panel-left">
    <div class="brandmark"><span class="dot"></span><span>Sereno Dental Suite</span></div>

    <div class="illustration-wrap">
      <div class="glass-halo"></div>
      <img class="owner-portrait" src="wajih.jpg" alt="Dental clinic" />
      <svg class="sparkle sp1" width="16" viewBox="0 0 24 24" fill="#7fd3e8"><path d="M12 0l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg>
      <svg class="sparkle sp2" width="14" viewBox="0 0 24 24" fill="#2c6fbb"><path d="M12 0l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg>
      <svg class="sparkle sp3" width="10" viewBox="0 0 24 24" fill="#7fd3e8"><path d="M12 0l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg>
    </div>

    <div class="left-copy">
      <h2>Dental clinic staff</h2>
      <p>Proprietaire du cabinet dentaire et responsable du suivi clinique.</p>
    </div>
  </section>

  <section class="panel-right">
    <div class="card" [class.shake]="shakeCard">
      <div class="card-header stagger">
        <div class="icon-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3c-3 0-5 2.2-5 5.4 0 3.6 1.4 6.1 1.9 8.8.3 1.6 2 1.7 2.4.2.4-1.5.6-2.9 1.7-2.9s1.3 1.4 1.7 2.9c.4 1.5 2.1 1.4 2.4-.2.5-2.7 1.9-5.2 1.9-8.8C17 5.2 15 3 12 3z"/>
          </svg>
        </div>
        <h1>Dentist Management System</h1>
        <p>Secure access for authorized dental staff.</p>
      </div>

      <form novalidate class="stagger" (ngSubmit)="login()">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap" [class.focused]="usernameFocused" [class.error]="!!usernameError">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="username" name="username" type="text" placeholder="Enter your staff ID" autocomplete="username" required [(ngModel)]="username" (focus)="usernameFocused = true" (blur)="usernameFocused = false" />
          </div>
          <div class="error-msg" [class.show]="!!usernameError">{{ usernameError }}</div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap" [class.focused]="passwordFocused" [class.error]="!!passwordError || !!loginError">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required [(ngModel)]="password" (focus)="passwordFocused = true" (blur)="passwordFocused = false" />
          </div>
          <div class="error-msg" [class.show]="!!passwordError || !!loginError">{{ passwordError || loginError }}</div>
        </div>

        <button type="submit" class="btn-signin" [class.loading]="isLoading" [class.success]="isSuccess" [disabled]="isLoading">
          <span class="btn-label"><span>{{ isSuccess ? 'Signed In' : 'Sign In' }}</span></span>
          <span class="spinner" aria-hidden="true"></span>
          <svg class="check-mark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </button>

        <p class="form-footnote">Access restricted to verified clinic personnel.</p>
      </form>
    </div>
  </section>
</div>
